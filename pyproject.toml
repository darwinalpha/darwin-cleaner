[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-cleaner"
version = "0.4.3"
description = "Contract- and rules-driven single-file cleaning engine: parquet → row/column forks → ordered middleware chain → data and meta"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.urls]
"Chinese Documentation" = "https://github.com/darwinalpha/darwin-cleaner/blob/main/README.cn.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
